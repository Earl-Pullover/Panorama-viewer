<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>360 Viewer</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: sans-serif;
}

button {
  position: absolute;
  left: 20px;
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  background: white;
  cursor: pointer;
  z-index: 10;
}

#fullscreenBtn { top: 20px; }
#gyroBtn { top: 70px; }
</style>
</head>

<body>

<button id="fullscreenBtn">Fullscreen</button>
<button id="gyroBtn">Enable Gyro</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let lon = 0, lat = 0;
let isUserInteracting = false;
let onPointerDownLon = 0, onPointerDownLat = 0;
let onPointerDownPointerX = 0, onPointerDownPointerY = 0;

let deviceOrientationEnabled = false;
let alpha = 0, beta = 0, gamma = 0;

init();
animate();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    1,
    1100
  );

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const geometry = new THREE.SphereGeometry(500, 60, 40);
  geometry.scale(-1, 1, 1);

  const loader = new THREE.TextureLoader();
  loader.load(
    "panorama.jpg",
    function(texture) {

      texture.colorSpace = THREE.SRGBColorSpace;

      const material = new THREE.MeshBasicMaterial({
        map: texture
      });

      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

    },
    undefined,
    function(error) {
      console.error("Texture failed to load:", error);
    }
  );

  document.addEventListener("pointerdown", onPointerDown);
  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", () => isUserInteracting = false);

  document.addEventListener("wheel", onMouseWheel);

  window.addEventListener("resize", onWindowResize);

  window.addEventListener("deviceorientation", function(event) {
    if (!deviceOrientationEnabled) return;

    alpha = event.alpha;
    beta = event.beta;
    gamma = event.gamma;
  });

}

function onPointerDown(event) {
  isUserInteracting = true;
  onPointerDownPointerX = event.clientX;
  onPointerDownPointerY = event.clientY;
  onPointerDownLon = lon;
  onPointerDownLat = lat;
}

function onPointerMove(event) {
  if (isUserInteracting) {
    lon = (onPointerDownPointerX - event.clientX) * 0.1 + onPointerDownLon;
    lat = (event.clientY - onPointerDownPointerY) * 0.1 + onPointerDownLat;
  }
}

function onMouseWheel(event) {
  camera.fov += event.deltaY * 0.05;
  camera.fov = Math.max(30, Math.min(100, camera.fov));
  camera.updateProjectionMatrix();
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  update();
}

function update() {

  if (deviceOrientationEnabled && beta !== null) {

    const euler = new THREE.Euler(
      THREE.MathUtils.degToRad(beta -90),
      THREE.MathUtils.degToRad(alpha),
      -THREE.MathUtils.degToRad(gamma),
      "YXZ"
    );

    camera.quaternion.setFromEuler(euler);

  } else {

    lat = Math.max(-85, Math.min(85, lat));
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);

    const x = 500 * Math.sin(phi) * Math.cos(theta);
    const y = 500 * Math.cos(phi);
    const z = 500 * Math.sin(phi) * Math.sin(theta);

    camera.lookAt(x, y, z);
  }

  renderer.render(scene, camera);
}

document.getElementById("fullscreenBtn").addEventListener("click", function() {

  const elem = document.documentElement;

  if (!document.fullscreenElement) {
    elem.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }

});

document.getElementById("gyroBtn").addEventListener("click", function() {

  if (typeof DeviceOrientationEvent.requestPermission === "function") {

    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === "granted") {
          deviceOrientationEnabled = true;
        }
      })
      .catch(console.error);

  } else {
    deviceOrientationEnabled = true;
  }

});

</script>

</body>
</html>
